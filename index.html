<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇小游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div>
        <h1>贪吃蛇</h1>
        <p class="subtitle">用方向键或 WASD 控制，空格键暂停。</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat__label">分数</span>
          <span id="score" class="stat__value">0</span>
        </div>
        <div class="stat">
          <span class="stat__label">最高分</span>
          <span id="best-score" class="stat__value">0</span>
        </div>
      </div>
    </header>

    <section class="board">
      <canvas id="game" width="480" height="480" aria-label="贪吃蛇游戏画布"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">点击开始</h2>
        <p id="overlay-desc">躲避边界与自己，吃到食物即可增长。</p>
        <button id="start-button" class="primary">开始游戏</button>
      </div>
    </section>

    <footer class="controls">
      <button id="restart" class="ghost">重新开始</button>
      <button id="pause" class="ghost">暂停</button>
      <div class="speed">
        <label for="speed-select">速度</label>
        <select id="speed-select">
          <option value="140">慢</option>
          <option value="110" selected>中</option>
          <option value="80">快</option>
        </select>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
